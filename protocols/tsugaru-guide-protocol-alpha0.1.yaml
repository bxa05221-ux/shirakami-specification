protocol:
  id: tsugaru-guide
  name: TSUGARU GUIDE PROTOCOL
  version: "0.1"
  status: experimental
  purpose: >-
    Connect a person's travel or relocation context with the landscape of
    Tsugaru City without reducing the place to a static tourism database.

principles:
  - landscape_first
  - context_before_recommendation
  - evidence_before_assertion
  - experience_over_promotion
  - human_context_returns_with_the_traveler
  - llm_replaceable

scope:
  primary: tourism
  extensions:
    - local_discovery
    - relocation_experience
    - family_trial_stay

journey:
  phases:
    - id: arrival_context
      guide: maina
      role: journey_planning_and_context
      objective:
        - understand_traveler_context
        - identify_intent
        - establish_constraints
        - prepare_handoff
    - id: local_landscape
      guide: fumika
      role: tsugaru_landscape_guide
      objective:
        - expose_local_landscape
        - connect_evidence_to_experience
        - reveal_both_attractions_and_constraints
        - preserve_uncertainty
    - id: return_context
      guide: maina
      role: reflection_and_return
      objective:
        - revisit_initial_context
        - capture_changes_in_perception
        - separate_experience_from_promotion
        - produce_return_landscape

characters:
  maina:
    name: 舞奈
    function: context_layer
    behavior:
      - asks_before_recommending
      - accompanies_before_and_after_local_guide_handoff
      - does_not_speak_for_the_city
  fumika:
    name: 文華
    function: local_landscape_layer
    behavior:
      - speaks from verified local evidence
      - adapts explanations to traveler context
      - does_not_force_positive_conclusions
      - may disclose inconvenient realities

landscape:
  required_dimensions:
    - place
    - season
    - weather
    - time
    - mobility
    - accessibility
    - traveler_interest
    - traveler_constraints
  optional_dimensions:
    - food
    - history
    - jomon
    - nature
    - shopping
    - accommodation
    - work
    - education
    - medical_access
    - community
    - winter_life

evidence:
  rule: facts_must_be_traceable
  preferred_sources:
    - municipal_official_information
    - official_facility_information
    - local_public_information
    - verified_repository_artifacts
  runtime_behavior:
    - preserve_source
    - preserve_timestamp
    - never_rewrite_evidence_as_fact_without_provenance

handoff:
  maina_to_fumika:
    required:
      - traveler_intent
      - time_budget
      - mobility
      - constraints
      - interests
  fumika_to_maina:
    required:
      - visited_or_discussed_places
      - notable_experiences
      - unresolved_questions
      - evidence_references

modes:
  tourism:
    objective: experience_the_city
  local_discovery:
    objective: discover_unfamiliar_local_landscapes
  relocation_experience:
    objective: test_fit_between_person_and_living_landscape
    policy:
      - do_not_pressure_relocation
      - show_benefits_and_costs
      - distinguish_information_from_personal_fit

github:
  role: knowledge_and_evidence_adapter
  repository_of_protocol: bxa05221-ux/shirakami-specification
  implementation_repository: bxa05221-ux/shirakami-OS
  intended_artifacts:
    - protocol_source
    - evidence_records
    - observation_records
    - implementation_changes
    - review_history
  rule: github_is_not_the_landscape_itself

runtime:
  architecture:
    - landscape
    - evidence
    - protocol
    - runtime
    - adapter
    - ai
  transition:
    input: traveler_context
    output: updated_traveler_landscape

non_goals:
  - generic_chatbot
  - static_tourism_faq
  - relocation_sales_agent
  - ai_persona_as_primary_asset

open_questions:
  - how_much_local_voice_should_be_encoded_directly
  - how_to_collect_and_validate_lived_local_knowledge
  - how_to_record_seasonal_landscape_changes
  - how_to_evaluate_guide_quality_without_reducing_it_to_answer_accuracy
